name: CI/CD Pipeline - Authentication Serverless Function

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  DOTNET_VERSION: "10.0.x"
  DOCKER_IMAGE_NAME: "ghcr.io/dvdalves/fiap-tech-challenge-auth"
  STATE_RESOURCE_GROUP: "fiap-terraform-state-rg"
  STATE_STORAGE_ACCOUNT: "fiapdbtfstate2026"
  STATE_CONTAINER: "tfstate"
  STATE_KEY: "lambda/production.terraform.tfstate"

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # 1. BUILD & TESTES AUTOMATIZADOS (.NET)
  # ============================================================================
  build-and-test:
    name: 🧪 Build & Testes Automatizados (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 📦 Restaurar Dependências
        run: dotnet restore FIAP.Tech.Challenge.Lambda.slnx

      - name: 🔨 Compilar Solução
        run: dotnet build FIAP.Tech.Challenge.Lambda.slnx --no-restore --configuration Release

      - name: 🧪 Executar Testes Unitários
        run: dotnet test FIAP.Tech.Challenge.Lambda.slnx --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  # ============================================================================
  # 2. VALIDAÇÃO DE INFRAESTRUTURA (TERRAFORM)
  # ============================================================================
  terraform-validate:
    name: 🏗️ Terraform Format & Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: 🔍 Terraform Format Check
        run: terraform -chdir=infra fmt -check

      - name: 🔍 Terraform Init & Validate
        run: |
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate

  # ============================================================================
  # 3. CONTEINERIZAÇÃO (DOCKER BUILD)
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build & Validação
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Compilar Imagem Docker da Lambda
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}

  # ============================================================================
  # 4. DEPLOY AUTOMÁTICO (AZURE CONTAINER APPS)
  # ============================================================================
  deploy:
    name: 🚀 Deploy Azure Container Apps
    needs: [build-and-test, terraform-validate, docker-build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🧩 Registrar Azure Container Apps
        run: az provider register --namespace Microsoft.App --wait

      - name: ⚙️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: 🚀 Terraform Apply
        run: |
          az group create --name "$STATE_RESOURCE_GROUP" --location "North Central US" --output none
          az storage account create --name "$STATE_STORAGE_ACCOUNT" --resource-group "$STATE_RESOURCE_GROUP" --location "North Central US" --sku Standard_LRS --kind StorageV2 --allow-blob-public-access false --output none
          ACCOUNT_KEY=$(az storage account keys list --resource-group "$STATE_RESOURCE_GROUP" --account-name "$STATE_STORAGE_ACCOUNT" --query "[0].value" --output tsv)
          az storage container create --name "$STATE_CONTAINER" --account-name "$STATE_STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" --output none
          terraform -chdir=infra init \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY" \
            -backend-config="access_key=$ACCOUNT_KEY"
          SUBSCRIPTION_ID=$(az account show --query id --output tsv)
          import_if_needed() {
            ADDRESS="$1"
            RESOURCE_ID="$2"
            if ! terraform -chdir=infra state show "$ADDRESS" >/dev/null 2>&1 && az resource show --ids "$RESOURCE_ID" >/dev/null 2>&1; then
              terraform -chdir=infra import "$ADDRESS" "$RESOURCE_ID"
            fi
          }
          BASE="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/fiap-tech-challenge-rg"
          import_if_needed azurerm_log_analytics_workspace.main "$BASE/providers/Microsoft.OperationalInsights/workspaces/oficina-auth-auth-logs"
          import_if_needed azurerm_container_app_environment.main "$BASE/providers/Microsoft.App/managedEnvironments/oficina-auth-env"
          import_if_needed azurerm_container_app.auth "$BASE/providers/Microsoft.App/containerApps/oficina-auth-auth"
          terraform -chdir=infra apply -auto-approve \
            -var="container_image=${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}" \
            -var="db_connection_string=${{ secrets.DB_CONNECTION_STRING }}" \
            -var="jwt_secret_key=${{ secrets.JWT_SECRET_KEY }}"
